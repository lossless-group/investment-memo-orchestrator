[project]
name = "investment-memo-orchestrator"
dynamic = ["version"]
description = "Multi-agent orchestration system for generating investment memos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    # Imported directly as `from anthropic import Anthropic` in 15 modules.
    # It used to arrive only transitively through langchain-anthropic, so a
    # langchain upgrade that dropped or renamed it would have broken every
    # extractor at import time with nothing in this file to explain why.
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",  # For brand configuration files
    "rich>=13.0.0",  # For nice terminal output
    "tavily-python>=0.3.0",  # Web search for research
    "httpx>=0.27.0",  # For web fetching
    "beautifulsoup4>=4.12.0",  # For HTML parsing
    "firecrawl-py>=2.0.0",  # Web crawling for team roster extraction
    "openai>=1.0.0",  # Optional: for Perplexity API (uses OpenAI SDK)
    "PyMuPDF>=1.24.0",  # Primary PDF text + rendering backend (imported as pymupdf/fitz)
    "pdf2image>=1.17.0",  # For high-quality PDF page rendering (wraps Poppler)
    "pillow>=10.0.0",  # Image handling for deck page rendering (imported as PIL)
    "python-pptx>=1.0.0",  # For PowerPoint deck analysis
    "pypandoc>=1.13",  # For markdown to Word conversion
    "weasyprint>=60.0",  # For HTML to PDF conversion (wkhtmltopdf replacement)
    "python-docx>=1.2.0",  # For Word document generation
    "google-auth>=2.0.0",  # For Google API authentication
    "google-auth-oauthlib>=1.0.0",  # For OAuth flow
    "google-auth-httplib2>=0.2.0",  # For HTTP authentication
    "google-api-python-client>=2.0.0",  # For Google Drive/Docs API
    "pandas>=2.0.0",  # For spreadsheet/cap table extraction
    "openpyxl>=3.1.0",  # For Excel (.xlsx) file reading
    "pdfplumber>=0.10.0",  # For PDF table extraction (cap tables, datarooms)
    "matplotlib>=3.8.0",  # For diagram generation (TAM/SAM/SOM, funnels, etc.)
    "questionary>=2.0.0",  # For interactive CLI prompts
    "fastapi>=0.110.0",  # HTTP API surface (src/server)
    "uvicorn[standard]>=0.27.0",  # ASGI server for FastAPI
    "sse-starlette>=2.0.0",  # Server-Sent Events for streaming job logs
]

[project.scripts]
memopop = "cli.terminal_app.py_rich.app:main"
memopop-server = "src.server.app:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # [tool.pytest.ini_options] sets asyncio_mode = "auto", which is a
    # pytest-asyncio option — without the plugin declared here, every async
    # test errors out and pytest warns "Unknown config option: asyncio_mode".
    "pytest-asyncio>=0.23.0",
    # Coverage measurement. The pipeline has grown past the point where
    # "282 tests pass" tells you anything about what is actually covered.
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["src*", "cli*"]

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Run coverage by default. No global threshold yet — the suite is uneven and a
# blanket --cov-fail-under would either be set so low it means nothing or would
# block every commit. Ratchet per-module instead, as modules get covered.
addopts = "--cov=src --cov=cli --cov-report=term-missing:skip-covered --cov-report=html:.coverage-html"

[tool.coverage.run]
branch = true
omit = [
    "*/__pycache__/*",
    "*/.venv/*",
    "src/scrapers/*",      # network-bound; covered by integration runs, not unit tests
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools_scm]
# Version will be derived from git tags
# Tags should follow format: v0.1.0, v0.2.0, etc.
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
